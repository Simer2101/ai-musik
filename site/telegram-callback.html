<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sonari — вход через Telegram</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #0b0b0d; color: #f3f3f0; }
      a { color: #c6f432; }
    </style>
  </head>
  <body>
    <p>Возвращаемся в Sonari… <a id="open" href="sonari://auth">Открыть приложение</a></p>
    <script>
      // Telegram returns here with #tgAuthResult=…; hand it to the phone app.
      var target = 'sonari://auth' + window.location.hash;
      document.getElementById('open').href = target;
      window.location.replace(target);
    </script>
  </body>
</html>
